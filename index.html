<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4c1d95"><title>Velan Chit Fund</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1340;--vio:#6d28d9;--pink:#ec4899;--org:#f97316;--teal:#14b8a6;--lime:#84cc16;--sky:#38bdf8;--bg:#f5f3ff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);max-width:480px;margin:0 auto;min-height:100vh;padding:0 0 90px}
header{background:linear-gradient(135deg,#4c1d95,#be185d 70%,#f97316);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 26px;border-radius:0 0 28px 28px;position:sticky;top:0;z-index:5}
header h1{font-size:22px}header small{opacity:.8}
main{padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat{border-radius:18px;padding:14px;color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.12)}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;opacity:.9}
.s1{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}.s2{background:linear-gradient(135deg,#f472b6,#db2777)}
.s3{background:linear-gradient(135deg,#2dd4bf,#0d9488)}.s4{background:linear-gradient(135deg,#fb923c,#ea580c)}
h3{margin:14px 0 8px}.muted{color:#6b6490;font-size:13px}
.card,.row{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:0 3px 10px rgba(76,29,149,.1);display:flex;align-items:center;gap:12px}
.card>div,.row>div{flex:1;min-width:0}.row small,.card small{display:block;color:#6b6490;font-size:12px}
.mo{width:36px;height:36px;border-radius:12px;background:var(--sky);color:#fff;display:grid;place-items:center}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--org));color:#fff;display:grid;place-items:center;font-weight:700}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;color:#fff;background:var(--org)}.pill.g{background:var(--teal)}.pill.v{background:var(--vio)}
.hero{border-radius:20px;padding:16px;color:#fff;margin-bottom:14px}
.hero.fixed{background:linear-gradient(135deg,#0ea5e9,#6366f1)}.hero.auction{background:linear-gradient(135deg,#ec4899,#f97316)}
.bar{height:8px;border-radius:9px;background:#ede9fe;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--lime))}
#fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:84px;width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--pink),var(--org));color:#fff;font-size:30px;box-shadow:0 8px 18px rgba(236,72,153,.45);z-index:8}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:flex;padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px);border-radius:22px 22px 0 0;box-shadow:0 -4px 16px rgba(76,29,149,.18);z-index:9}
nav button{flex:1;border:0;background:none;font-size:20px;padding:6px 0;border-radius:14px;color:#8b84b0}
nav button span{display:block;font-size:10px;font-family:inherit}nav button.on{background:linear-gradient(135deg,#ede9fe,#fce7f3);color:var(--vio);font-weight:700}
input,select{width:100%;padding:12px;border:2px solid #ddd6fe;border-radius:12px;font:inherit;margin:4px 0 10px;background:#fff}
label{font-size:13px;font-weight:600}
.btn{width:100%;padding:13px;border:0;border-radius:14px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--vio),var(--pink));margin-top:8px}
.btn.g{background:linear-gradient(135deg,var(--teal),var(--lime))}.btn.r{background:linear-gradient(135deg,#ef4444,#f97316)}
.back{border:0;background:#ede9fe;color:var(--vio);border-radius:12px;padding:8px 14px;font:inherit;font-weight:600;margin-bottom:12px}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0ebff}.chk input{width:22px;margin:0}.chk span{flex:1}
#modal{display:none;position:fixed;inset:0;background:rgba(27,19,64,.55);z-index:20;align-items:flex-end;justify-content:center}
#modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px;animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.empty{text-align:center;padding:40px 10px;color:#6b6490}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}

.btn.wa,.pill.wa{background:#25d366}
.chart{display:flex;gap:10px;align-items:flex-end;margin-bottom:6px}.col{flex:1;text-align:center;font-size:10px;color:#6b6490}
.bk{height:110px;display:flex;flex-direction:column-reverse;justify-content:flex-start;background:#f3f0ff;border-radius:8px;overflow:hidden;margin-bottom:4px}.bk i{display:block;width:100%}


.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calhead{font-size:11px;text-align:center;color:#777;padding:5px}.calday{min-height:72px;background:#faf9ff;border:1px solid #eee;border-radius:10px;padding:6px;overflow:hidden}.calday b{display:block;margin-bottom:4px}.calday span{display:block;font-size:9px;background:#fff;padding:3px;margin:2px 0;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head>
<body>
<header><h1 id="title">Dashboard</h1><small>Velan Chit Fund</small></header>
<main id="main"></main>
<button id="fab" onclick="addNew()">+</button>
<nav>
<button data-t="home">🏠<span>Home</span></button>
<button data-t="mem">👥<span>Members</span></button>
<button data-t="chit">💰<span>Chits</span></button>
<button data-t="auc">🔨<span>Auction</span></button>
<button data-t="set">⚙️<span>Settings</span></button>
</nav>
<div id="modal"></div>
<script>
const $=s=>document.querySelector(s);
let db=JSON.parse(localStorage.getItem('velanChit')||'null')||{members:[],chits:[],pay:{},adv:{},expenses:[]};
db.pay=db.pay||{};db.adv=db.adv||{};db.expenses=db.expenses||[];
const save=()=>localStorage.setItem('velanChit',JSON.stringify(db));
const ensureMeta=()=>{db.meta=db.meta||{};db.meta.receiptYear=db.meta.receiptYear||new Date().getFullYear();db.meta.receiptSeq=Number(db.meta.receiptSeq||0)};
ensureMeta();
const snapshot=()=>JSON.stringify(db);
const pushUndo=()=>{localStorage.setItem('velanChitUndo',snapshot());localStorage.setItem('velanChitUndoAt',new Date().toLocaleString('en-IN'))};
const undoAvailable=()=>!!localStorage.getItem('velanChitUndo');
function undoLast(){const raw=localStorage.getItem('velanChitUndo');if(!raw)return alert('Nothing to undo yet.');try{const current=snapshot();db=JSON.parse(raw);ensureMeta();save();localStorage.setItem('velanChitUndo',current);render();alert('↩️ Last action undone. Press Undo again to redo it.')}catch(e){alert('Undo data is invalid.')}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const rs=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=id=>(db.members.find(x=>x.id==id)||{}).name||'-';
const getC=id=>db.chits.find(c=>c.id==id);
const key=(c,m,id)=>c.id+'_'+m+'_'+id;
const base=c=>c.value/c.months;
const winnerOf=(c,m)=>c.rounds[m]&&c.rounds[m].winner;
const div=(c,m)=>(c.rounds[m]&&c.rounds[m].dividend)||0;
const wonBy=(c,m,id)=>{for(let k=0;k<=m;k++)if(winnerOf(c,k)==id)return true;return false};
const due=(c,m,id)=>Math.max(0,base(c)-(wonBy(c,m,id)?0:div(c,m)));
const advBal=id=>Number(db.adv[id]||0);
const payRec=(c,m,id)=>db.pay[key(c,m,id)];
const isPaid=(c,m,id)=>!!payRec(c,m,id);
const fmtDate=d=>d?new Date(d).toLocaleDateString('en-IN'):'';
const paymentStatus=(c,m,id)=>{const r=payRec(c,m,id);return r?'Paid':'Pending'};
const applyAdvance=(c,m,id)=>{const k=key(c,m,id),d=due(c,m,id);if(!d||isPaid(c,m,id)||advBal(id)<=0)return;const used=Math.min(d,advBal(id));db.adv[id]=advBal(id)-used;db.pay[k]={amount:d,method:'Advance',date:new Date().toISOString(),advanceUsed:used};};
const curM=c=>{const s=new Date(c.start),n=new Date();return Math.min(c.months-1,Math.max(0,(n.getFullYear()-s.getFullYear())*12+n.getMonth()-s.getMonth()))};
const nextM=c=>{for(let m=0;m<c.months;m++)if(!winnerOf(c,m))return m;return -1};
let tab='home',view=null,auc=null;

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;view=null;render()});
function render(){
 $('#title').textContent={home:'Dashboard',mem:'Members',chit:'Chits',auc:'Auction',set:'Settings'}[tab];
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 $('#fab').style.display=(tab=='mem'||(tab=='chit'&&!view))?'block':'none';
 $('#main').innerHTML=({home:vHome,mem:vMem,chit:vChit,auc:vAuc,set:vSet}[tab])();
}
const empty=t=>`<div class="empty">${t}</div>`;
function modal(h){$('#modal').innerHTML=`<div class="sheet">${h}<button class="btn" onclick="closeM()">Done</button></div>`;$('#modal').classList.add('open')}
function closeM(){$('#modal').classList.remove('open');render()}
function addNew(){tab=='mem'?memForm():chitForm()}

function calc(){
 const r={col:0,pen:0,mon:{},mem:{},ch:{}};
 db.chits.forEach(c=>{const cur=curM(c),s=new Date(c.start);let cc=0,pp=0;
  for(let m=0;m<c.months;m++){const k=new Date(s.getFullYear(),s.getMonth()+m,1),mk=k.getFullYear()+'-'+String(k.getMonth()+1).padStart(2,'0');
   r.mon[mk]=r.mon[mk]||{col:0,pen:0};
   c.members.forEach(id=>{const d=due(c,m,id);
    if(db.pay[key(c,m,id)]){r.col+=d;cc+=d;r.mon[mk].col+=d}
    else if(m<=cur){r.pen+=d;pp+=d;r.mon[mk].pen+=d;(r.mem[id]=r.mem[id]||[]).push({c,m,d})}})}
  r.ch[c.id]={cc,pp}});
 return r}
function vHome(){
 const k=calc();
 let h=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"><button class="btn" style="margin:0" onclick="monthlyReport()">📊 Monthly Report</button><button class="btn" style="margin:0" onclick="defaulterList()">🚨 Defaulters</button><button class="btn" style="margin:0" onclick="showCalendar()">📅 Calendar</button><button class="btn" style="margin:0" onclick="undoLast()">↩️ Undo</button></div><div class="grid"><div class="stat s1"><b>${db.members.length}</b><span>Members</span></div><div class="stat s2"><b>${db.chits.length}</b><span>Chits</span></div><div class="stat s3"><b>${rs(k.col)}</b><span>Collected</span></div><div class="stat s4"><b>${rs(k.pen)}</b><span>Pending dues</span></div></div>`;
 if(!db.chits.length)return h+empty('No chits yet. Add members, then create a chit.');
 const n=new Date(),nk=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0'),ks=Object.keys(k.mon).sort();
 let use=ks.filter(x=>x<=nk).slice(-6);if(!use.length)use=ks.slice(0,6);
 const mx=Math.max(1,...use.map(x=>k.mon[x].col+k.mon[x].pen));
 h+=`<h3>Month-wise collection</h3><div class="card" style="display:block"><div class="chart">${use.map(x=>{const v=k.mon[x];return `<div class="col"><div class="bk"><i style="height:${v.col/mx*100}%;background:#14b8a6"></i><i style="height:${v.pen/mx*100}%;background:#f97316"></i></div>${x.slice(5)}/${x.slice(2,4)}</div>`}).join('')}</div><small class="muted">🟩 Collected &nbsp; 🟧 Pending</small></div>`;
 h+=`<h3>Chit-wise status</h3>`+db.chits.map(c=>{const v=k.ch[c.id],t=v.cc+v.pp,p=t?Math.round(100*v.cc/t):0;
  return `<div class="card" onclick="tab='chit';view='${c.id}';render()"><div><strong>${esc(c.name)}</strong><small>Collected ${rs(v.cc)} • Pending ${rs(v.pp)}</small><div class="bar"><i style="width:${p}%"></i></div></div><span class="pill v">${p}%</span></div>`}).join('');
 const od=Object.keys(k.mem);
 h+=`<h3>⚠️ Pending alerts</h3>`;
 const alerts=[];db.chits.forEach(c=>{const cur=curM(c);for(let m=0;m<=cur;m++)c.members.forEach(id=>{if(!db.pay[key(c,m,id)])alerts.push({id,c,m,d:due(c,m,id)})})});
 const by={};alerts.forEach(x=>{by[x.id]=by[x.id]||[];by[x.id].push(x)});
 const alertIds=Object.keys(by);
 h+=alertIds.some(id=>by[id].length>=2)?`<div class="card"><div><strong>🚨 Attention</strong><small>${alertIds.filter(id=>by[id].length>=2).length} member(s) have 2+ pending months.</small></div></div>`:'';
 h+=alertIds.length?alertIds.slice(0,6).map(id=>{const a=by[id],t=a.reduce((v,x)=>v+x.d,0);return `<div class="card"><div><strong>🔴 ${esc(nm(id))}</strong><small>${a.length} pending month(s) • ${rs(t)}</small></div><button class="pill wa" style="border:0" onclick="wa('${id}')">WhatsApp</button></div>`}).join(''):empty('No pending alerts 🎉');
 h+=`<h3>Overdue members</h3>`+(od.length?od.map(id=>{const t=k.mem[id].reduce((a,x)=>a+x.d,0);return `<div class="card"><div class="av">${esc(nm(id)[0]).toUpperCase()}</div><div><strong>${esc(nm(id))}</strong><small>Pending ${rs(t)}</small></div><button class="pill wa" style="border:0" onclick="wa('${id}')">WhatsApp</button></div>`}).join(''):empty('No overdue dues 🎉'));
 return h;
}
function wa(id){
 const mb=db.members.find(x=>x.id==id),L=calc().mem[id]||[];
 if(!L.length)return alert('No pending dues');
 let p=(mb.phone||'').replace(/\D/g,'');if(!p)return alert('Add phone number first (Edit member)');if(p.length==10)p='91'+p;
 const t=`Vanakkam ${mb.name}, Velan Chit Fund reminder:\n`+L.map(x=>`${x.c.name} - Month ${x.m+1}: ${rs(x.d)}`).join('\n')+`\nTotal pending: ${rs(L.reduce((a,x)=>a+x.d,0))}. Please pay soon. Nandri.`;
 window.open('https://wa.me/'+p+'?text='+encodeURIComponent(t),'_blank');
}
function vMem(){
 if(!db.members.length)return empty('No members yet. Tap + to add one.');
 return db.members.map(m=>`<div class="card" onclick="memberProfile('${m.id}')"><div class="av">${esc(m.name[0]).toUpperCase()}</div><div><strong>${esc(m.name)}</strong><small>${esc(m.phone||'No phone')} • Advance ${rs(advBal(m.id))}</small></div><button class="pill v" style="border:0" onclick="event.stopPropagation();memForm('${m.id}')">Edit</button><button class="pill" style="border:0" onclick="event.stopPropagation();delMem('${m.id}')">Delete</button></div>`).join('');
}
function memberProfile(id){
 const mb=db.members.find(x=>x.id==id);if(!mb)return;
 let paid=0,pending=0,wins=[];db.chits.filter(c=>c.members.includes(id)).forEach(c=>{for(let m=0;m<c.months;m++){const d=due(c,m,id);if(isPaid(c,m,id))paid+=d;else if(m<=curM(c))pending+=d;if(winnerOf(c,m)==id)wins.push({c,m,r:c.rounds[m]||{}})}});
 const winHtml=wins.length?wins.map(x=>`<div class="row"><div><strong>🏆 ${esc(x.c.name)} • Month ${x.m+1}</strong><small>${x.r.mode=='draw'?'Lucky Draw':x.r.bid?'Auction Winner':'Winner'} • ${fmtDate(new Date(new Date(x.c.start).getFullYear(),new Date(x.c.start).getMonth()+x.m,1))}</small></div><span class="pill v">${x.r.bid?rs(x.r.bid):'Winner'}</span></div>`).join(''):empty('No winner history yet');
 modal(`<h3>👤 ${esc(mb.name)}</h3><p class="muted">${esc(mb.phone||'No phone')}</p><div class="grid"><div class="stat s3"><b>${rs(paid)}</b><span>Total paid</span></div><div class="stat s4"><b>${rs(pending)}</b><span>Pending</span></div><div class="stat s1"><b>${rs(advBal(id))}</b><span>Advance balance</span></div><div class="stat s2"><b>${wins.length}</b><span>Wins</span></div></div><button class="btn g" onclick="advanceForm('${id}')">➕ Add Advance Payment</button><button class="btn" onclick="memberStmt('${id}')">🧾 Statement</button><h3>🏆 Winner history</h3>${winHtml}`);
}
function advanceForm(id){modal(`<h3>💰 Add Advance Payment</h3><label>Amount (₹)</label><input id="advAmt" type="number" min="1"><label>Payment method</label><select id="advMethod"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Cheque</option></select><button class="btn g" onclick="saveAdvance('${id}')">Save Advance</button>`)}
function saveAdvance(id){const a=+$('#advAmt').value;if(a<=0)return alert('Enter advance amount');pushUndo();db.adv[id]=advBal(id)+a;save();closeM();alert('Advance added: '+rs(a))}
function memForm(id){const m=id?db.members.find(x=>x.id==id):{name:'',phone:''};modal(`<h3>${id?'Edit':'New'} member</h3><label>Name</label><input id="mn" value="${esc(m.name)}"><label>Phone (WhatsApp)</label><input id="mp" type="tel" value="${esc(m.phone||'')}"><button class="btn g" onclick="saveMem('${id||''}')">Save member</button>`)}
function saveMem(id){const n=$('#mn').value.trim();if(!n)return alert('Enter a name');const p=$('#mp').value.trim();pushUndo();
 if(id){const m=db.members.find(x=>x.id==id);m.name=n;m.phone=p}else db.members.push({id:uid(),name:n,phone:p});save();closeM()}
function delMem(id){if(db.chits.some(c=>c.members.includes(id)))return alert('This member is in a chit. Remove the chit first.');if(confirm('Delete member?')){pushUndo();db.members=db.members.filter(m=>m.id!=id);save();render()}}
function histM(id){
 const mb=db.members.find(x=>x.id==id),k=calc(),L=k.mem[id]||[]; if(!mb)return;
 let paid=0,dv=0,pending=0,won=0;
 const rows=db.chits.filter(c=>c.members.includes(id)).map(c=>{let p=0,dd=0,w=[];
  for(let m=0;m<c.months;m++){if(db.pay[key(c,m,id)])p+=due(c,m,id);else if(m<=curM(c))pending+=due(c,m,id);if(winnerOf(c,m)==id){w.push(m+1);won++}if(!wonBy(c,m,id))dd+=div(c,m)}
  paid+=p;dv+=dd;const pn=L.filter(x=>x.c.id==c.id).reduce((a,x)=>a+x.d,0);
  return `<div class="card"><div><strong>${esc(c.name)}</strong><small>Paid ${rs(p)} • Pending ${rs(pn)}${dd?' • Dividend '+rs(dd):''}${w.length?' • Won month '+w.join(', '):''}</small></div><button class="pill v" style="border:0" onclick="memberChitStmt('${id}','${c.id}')">Statement</button></div>`}).join('')||empty('Not in any chit yet');
 const wins=[];db.chits.filter(c=>c.members.includes(id)).forEach(c=>{for(let m=0;m<c.months;m++)if(winnerOf(c,m)==id)wins.push({c,m,r:c.rounds[m]||{}})});
 const winHtml=wins.length?wins.map(x=>`<div class="row"><div><strong>🏆 ${esc(x.c.name)} • Month ${x.m+1}</strong><small>${x.r.mode=='draw'?'Lucky Draw':x.r.bid?'Auction Winner':'Winner'} • ${new Date(new Date(x.c.start).getFullYear(),new Date(x.c.start).getMonth()+x.m,1).toLocaleDateString('en-IN',{month:'short',year:'numeric'})}</small></div><span class="pill v">${x.r.bid?rs(x.r.bid):'Winner'}</span></div>`).join(''):empty('No winner history yet');
 modal(`<h3>👤 ${esc(mb.name)}</h3><p class="muted">${esc(mb.phone||'No phone number')}</p><div class="grid"><div class="stat s3"><b>${rs(paid)}</b><span>Total paid</span></div><div class="stat s4"><b>${rs(pending)}</b><span>Pending</span></div><div class="stat s1"><b>${rs(dv)}</b><span>Dividend</span></div><div class="stat s2"><b>${won}</b><span>Wins</span></div></div><button class="btn" onclick="memberStmt('${id}')">🧾 Full Member Statement</button>${mb.phone?`<button class="btn wa" onclick="wa('${id}')">WhatsApp</button>`:''}<h3>🏆 Winner history</h3>${winHtml}<h3>Chit history</h3>${rows}`);
}

function chitCalc(cid){const c=getC(cid);modal(`<h3>🧮 Chit Calculator</h3><p class="muted">${esc(c.name)} • ${rs(c.value)} / ${c.months} months</p><label>Chit value (₹)</label><input id="calcV" type="number" value="${c.value}" oninput="updateCalc('${cid}')"><label>Members / Months</label><input id="calcM" type="number" value="${c.months}" oninput="updateCalc('${cid}')"><label>Commission %</label><input id="calcC" type="number" value="${c.comm||0}" oninput="updateCalc('${cid}')"><label>Auction take / winning amount (₹, optional)</label><input id="calcA" type="number" value="" oninput="updateCalc('${cid}')"><div id="calcOut"></div>`);updateCalc(cid)}
function updateCalc(cid){const v=+$('#calcV')?.value||0,m=Math.max(1,+$('#calcM')?.value||0,1),cp=+$('#calcC')?.value||0,a=+$('#calcA')?.value||0,monthly=v/m,commission=v*cp/100,discount=a>0?Math.max(0,v-a):0,dividend=a>0?Math.max(0,(discount-commission)/m):0,others=Math.max(0,monthly-dividend);const o=$('#calcOut');if(o)o.innerHTML=`<div class="grid" style="margin-top:12px"><div class="stat s2"><b>${rs(monthly)}</b><span>Base installment</span></div><div class="stat s4"><b>${rs(commission)}</b><span>Commission</span></div><div class="stat s3"><b>${rs(discount)}</b><span>Discount</span></div><div class="stat s1"><b>${rs(dividend)}</b><span>Dividend each</span></div></div><div class="card"><div><strong>Others pay: ${rs(others)}</strong><small>Winner takes ${a>0?rs(a):'enter auction amount'}</small></div></div>`}
function showCalendar(){const now=new Date(),y=now.getFullYear(),mo=now.getMonth(),first=new Date(y,mo,1),days=new Date(y,mo+1,0).getDate(),start=first.getDay(),cells=[];for(let i=0;i<start;i++)cells.push('<div></div>');for(let d=1;d<=days;d++){const events=[];db.chits.forEach(c=>{const s=new Date(c.start),idx=(y-s.getFullYear())*12+mo-s.getMonth();if(d===1&&idx>=0&&idx<c.months){const w=winnerOf(c,idx);events.push(`<span>${c.type=='auction'?'🔨':c.type=='draw'?'🎲':'📅'} ${esc(c.name)} M${idx+1}${w?' • '+esc(nm(w)):''}</span>`)}});cells.push(`<div class="calday"><b>${d}</b>${events.join('')}</div>`)}modal(`<h3>📅 ${now.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</h3><div class="calgrid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="calhead">${x}</div>`).join('')}${cells.join('')}</div><p class="muted">🔨 Auction • 🎲 Lucky Draw • 📅 Fixed chit month</p>`)}

 for(let m=0;m<c.months;m++)h+=`<tr><td>${m+1}</td><td>${winnerOf(c,m)?esc(nm(winnerOf(c,m))):'-'}</td><td>${div(c,m)?rs(div(c,m)):'-'}</td>${c.members.map(id=>db.pay[key(c,m,id)]?`<td class="p">${rs(due(c,m,id))} ✓</td>`:`<td class="u">${rs(due(c,m,id))}</td>`).join('')}</tr>`;
 h+=`</table></div><p><b>Collected:</b> ${rs(k.cc)} &nbsp; <b>Pending:</b> ${rs(k.pp)}</p><button onclick="print()">Print / Save as PDF</button></body></html>`;
 const w=window.open('','_blank');if(!w)return alert('Allow popups to open the statement');w.document.write(h);w.document.close();
