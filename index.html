<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Velan Chit Fund</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <div class="eyebrow">VELAN</div>
      <h1>Chit Fund</h1>
    </div>
    <button class="icon-btn" data-page="settings" aria-label="Settings">⚙</button>
  </header>

  <main id="appMain"></main>

  <nav class="bottom-nav">
    <button data-page="dashboard">⌂<span>Home</span></button>
    <button data-page="members">👥<span>Members</span></button>
    <button data-page="chits">◫<span>Chits</span></button>
    <button data-page="bid">🔨<span>Auction</span></button>
    <button data-page="settings">☰<span>Menu</span></button>
  </nav>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><h3 id="modalTitle"></h3><button class="icon-btn" onclick="closeModal()">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script src="script.js"></script>
</body>
</html>
